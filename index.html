<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three Rounds</title>
    <meta
      name="description"
      content="A space shooter in three rounds: pick one of three ships and take down a summoner, a berserker and a twin before your three lives run out."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!--
      The starfield behind the whole page. Decorative and driven entirely by
      main.ts, so it is hidden from assistive tech; the arena canvas above it
      is the one that carries a label.
    -->
    <canvas id="backdrop" aria-hidden="true"></canvas>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <div id="game-frame">
        <div id="game">
          <canvas id="arena" aria-label="Space shooter arena"></canvas>
          <button id="mute" type="button" aria-pressed="false" aria-label="Mute sound">🔊</button>
          <div id="select">
            <h1>Choose your ship</h1>
            <div id="select-body">
              <div id="ship-list"></div>
              <div id="ship-panel">
                <p id="panel-name"></p>
                <p id="panel-blurb"></p>
                <div id="panel-stats"></div>
              </div>
            </div>
            <!--
              A control affordance, not a tutorial: four key caps that light up
              when the real keys go down, and cycle on their own until they do.
              aria-hidden because "W A S D" read aloud is noise, and because the
              brief's no-instructions rule means the controls are meant to be
              found by trying them.
            -->
            <div id="keys" aria-hidden="true">
              <span class="key" data-dir="up">W</span>
              <span class="key" data-dir="left">A</span>
              <span class="key" data-dir="down">S</span>
              <span class="key" data-dir="right">D</span>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
